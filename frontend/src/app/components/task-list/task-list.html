<div class="list-container">
  <div class="list-header">
    <h2 class="list-title">📝 Lista de Tareas</h2>
    
    <div class="search-box">
      <input
        [(ngModel)]="filter"
        (input)="filterTasks()"
        placeholder="🔍 Buscar por título o estado..."
        class="search-input"
      >
    </div>
  </div>

  <div *ngIf="isLoading" class="loading-container">
    <div class="spinner"></div>
    <p>Cargando tareas...</p>
  </div>

  <div *ngIf="!isLoading && filteredTasks.length === 0" class="empty-state">
    <div class="empty-icon">📭</div>
    <h3>No hay tareas</h3>
    <p>{{ filter ? 'No se encontraron tareas con ese filtro' : 'Comienza creando tu primera tarea' }}</p>
  </div>

  <div *ngIf="!isLoading && filteredTasks.length > 0" class="tasks-grid">
    <div
      *ngFor="let task of filteredTasks"
      class="task-card"
    >
      <div class="task-header">
        <h3 class="task-title">{{ task.title }}</h3>
        <span class="task-status" [ngClass]="getStatusClass(task.status)">
          {{ task.status }}
        </span>
      </div>

      <p class="task-description">{{ task.description }}</p>

      <div class="task-footer">
        <span class="task-date" *ngIf="task.createdAt">
          📅 {{ task.createdAt | date:'short' }}
        </span>
        <div class="task-actions">
          <button
            (click)="editTask(task.id!)"
            class="btn-edit"
            title="Editar tarea"
          >
            ✏️ Editar
          </button>
          <button
            (click)="deleteTask(task.id!)"
            class="btn-delete"
            title="Eliminar tarea"
          >
            🗑️ Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
